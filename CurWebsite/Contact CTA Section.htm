<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact CTA Section</title>

<link href="Contact%20CTA%20Section_files/css2_dUFI.css" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:#f8fafc;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.cta-section{
    width:100%;
	height:10%;
    max-width:1000px;
}

.cta-card{
    background:linear-gradient(
        135deg,
        #2563eb 0%,
        #00d4ff 100%
    );
    border-radius:28px;
    padding:15px 15px;
    text-align:center;
    color:white;
    box-shadow:
        0 20px 50px rgba(37,99,235,.25);
    transition:all .35s ease;
}

.cta-card:hover{
    transform:translateY(-5px);
    box-shadow:
        0 30px 70px rgba(37,99,235,.35);
}

.cta-card h2{
    font-size:clamp(2rem,4vw,3rem);
    font-weight:600;
    margin-bottom:16px;
}

.cta-card p{
    font-size:1rem;
    line-height:1.8;
    opacity:.95;
    max-width:900px;
    margin:0 auto 10px;
}

.cta-btn{
    display:inline-block;
    background:white;
    color:#2563eb;
    text-decoration:none;
    font-weight:700;
    padding:15px 34px;
    border-radius:50px;
    transition:all .3s ease;
}

.cta-btn:hover{
    transform:translateY(-3px);
    box-shadow:
        0 12px 25px rgba(255,255,255,.25);
}

@media(max-width:768px){

    .cta-card{
        padding:40px 25px;
    }

    .cta-card p{
        font-size:1rem;
    }
}
</style>
</head>
<body>

<section class="cta-section">
    <div class="cta-card">
        <h2>Sample Files</h2>

        <p>
            Explore our sample files to understand the quality, 
structure, and formatting standards we follow. These examples provide a 
clear overview of the deliverables you can expect from our team.

        </p>

        <a href="https://aiasset-management.com/datalabeling/contact.html" class="cta-btn">
            Sample Files Here
        </a>
    </div>
</section>


</body></html>
